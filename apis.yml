name: MBX Biosciences
description: 'MBX Biosciences is a clinical-stage biopharmaceutical company developing novel precision
  peptide therapies for people living with endocrine and metabolic disorders. Its proprietary Precision
  Endocrine Peptide (PEP) platform engineers long-acting peptide prodrugs, and its pipeline includes
  canvuparatide (MBX 2109) for chronic hypoparathyroidism, MBX 4291 for obesity, and MBX 5765 for
  post-bariatric hypoglycemia. The company is publicly traded on Nasdaq under the ticker MBX. As a
  clinical-stage biotech it publishes no public API, developer portal, SDKs, or technical documentation
  surface; this profile is maintained for network completeness.'
